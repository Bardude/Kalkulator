<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strefy niebezpieczne – EOD</title>
<meta name="theme-color" content="#141814">
<meta name="description" content="EOD danger zone calculator: blast, fragments, IATG/IMAS demolition areas, TNT equivalent. Works offline.">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Strefy EOD">
<style>
  :root{
    --bg:#101310; --panel:#1a1f1a; --panel2:#222822; --line:#323a31;
    --text:#ecefe8; --muted:#9aa595; --accent:#e8a33a; --danger:#e2513b; --ok:#7fb069; --blue:#7fb2d9;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  body{min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .wrap{max-width:520px;margin:0 auto;padding:16px 16px 28px}

  header{display:flex;align-items:center;gap:14px;padding:8px 2px 16px;border-bottom:1px solid var(--line);margin-bottom:16px}
  header img{width:72px;height:72px;flex:none;border-radius:50%;box-shadow:0 0 0 2px var(--line),0 6px 18px rgba(0,0,0,.5)}
  header .t1{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
  header h1{margin:2px 0 0;font-size:21px;line-height:1.2;font-weight:750}

  /* przełączniki */
  .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:4px;margin-bottom:14px}
  .seg button{font:inherit;font-size:16px;font-weight:700;color:var(--muted);background:transparent;border:0;border-radius:10px;
    padding:13px 8px;cursor:pointer;line-height:1.15}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#1a1408;box-shadow:0 2px 10px rgba(232,163,58,.25)}
  .seg.small{background:var(--panel2);margin:0}
  .seg.small button{font-size:15px;padding:11px 6px}
  .seg.small button[aria-pressed="true"]{background:#3a4438;color:var(--text);box-shadow:inset 0 0 0 1.5px var(--accent)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  label,.lab{display:block;font-size:13px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
  .gap{height:16px}

  .select-wrap{position:relative}
  .select-wrap::after{content:"";position:absolute;right:18px;top:50%;width:10px;height:10px;margin-top:-7px;
    border-right:2.5px solid var(--accent);border-bottom:2.5px solid var(--accent);transform:rotate(45deg);pointer-events:none}
  select,input{width:100%;font:inherit;font-size:19px;color:var(--text);background:var(--panel2);
    border:1.5px solid var(--line);border-radius:12px;padding:15px 44px 15px 14px;appearance:none;-webkit-appearance:none;outline:none}
  select:focus,input:focus{border-color:var(--accent)}
  .hint{margin-top:10px;font-size:14.5px;line-height:1.45;color:var(--muted);
    background:rgba(232,163,58,.07);border-left:3px solid var(--accent);padding:9px 11px;border-radius:0 8px 8px 0}
  .hint b{color:var(--text)}

  .input-wrap{position:relative}
  .input-wrap .unit{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:18px;font-weight:600}
  input{font-size:26px;font-weight:700;padding-right:60px;font-variant-numeric:tabular-nums}
  input.bad{border-color:var(--danger)}
  .err{color:var(--danger);font-size:14px;margin-top:8px}
  .err:empty{display:none}

  .result{text-align:center;padding:22px 16px 18px;border-color:#4a3a22;
    background:radial-gradient(120% 90% at 50% 0%,rgba(232,163,58,.14),transparent 60%),var(--panel)}
  .result .lbl{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .big{font-size:clamp(64px,22vw,104px);line-height:1;font-weight:800;margin:10px 0 4px;color:var(--accent);
    font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .big small{font-size:.4em;color:var(--text);margin-left:6px;font-weight:700;letter-spacing:0}
  .result.empty .big{color:#4a5247}
  .result .sub{font-size:15px;color:var(--muted)}
  .calc{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:15px;color:var(--muted);
    font-variant-numeric:tabular-nums}
  .calc code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--text);font-size:13.5px}

  /* dwa wyniki odłamków */
  .pair{display:grid;gap:14px}
  .pair .big{font-size:clamp(56px,18vw,88px)}
  .pair .divider{height:1px;background:var(--line)}
  .pair .blue .big{color:var(--blue)}
  .warn{margin-top:14px;text-align:left;font-size:14px;line-height:1.45;color:#f3c58a;background:rgba(226,81,59,.12);
    border-left:3px solid var(--danger);padding:9px 11px;border-radius:0 8px 8px 0}
  .warn:empty{display:none}
  .applied{margin-top:12px;font-size:14px;color:var(--muted)}
  .applied b{color:var(--text)}

  table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums;margin-top:10px}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:650;text-align:right;padding:6px 8px;
    border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  td{padding:8px;text-align:right;border-bottom:1px solid #262c25}
  tr.on td{background:rgba(232,163,58,.16);color:var(--text);font-weight:700}
  tr.on td:first-child{box-shadow:inset 3px 0 0 var(--accent)}

  .formula{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted)}
  .formula .f{font-size:22px;font-weight:700;color:var(--text);font-family:Georgia,"Times New Roman",serif;white-space:nowrap}
  details{margin-top:10px;font-size:14px;color:var(--muted);line-height:1.5}
  summary{cursor:pointer;color:var(--text);font-weight:600}
  details ul{padding-left:18px;margin:8px 0 0}

  footer{font-size:12.5px;line-height:1.5;color:var(--muted);text-align:center;margin-top:18px}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:8px}
  .dot{width:8px;height:8px;border-radius:50%;background:#555}
  .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .seg button{font-size:15px;padding:13px 4px}
  .ft{font-size:15px;color:var(--muted);margin-top:2px}
  td code{white-space:nowrap;font-size:13px}
  .note{margin-top:12px;font-size:13.5px;line-height:1.45;color:var(--muted)}
  .note b{color:var(--text)}
  .src{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:10px}
  [hidden]{display:none!important}
  .langs{display:flex;justify-content:flex-end;gap:8px;margin:2px 0 6px}
  .langs button{width:36px;height:24px;padding:0;border:0;border-radius:4px;overflow:hidden;cursor:pointer;background:none;
    opacity:.5;box-shadow:0 0 0 1px var(--line);transition:opacity .15s}
  .langs button svg{display:block;width:100%;height:100%}
  .langs button[aria-pressed="true"]{opacity:1;box-shadow:0 0 0 2px var(--accent)}
  .seg>button{font-size:14.5px}
</style>
</head>

  i_expl: "<b>Відкрита місцевість (634)</b> — неможливо гарантувати, що в зоні не опиниться стороння особа: територія не огороджена й не охороняється, через неї проходять дороги чи стежки, поруч живуть люди, хтось може зайти, не знаючи про небезпеку. Відстань має захищати людей, які не знають про знищення і ніким не контролюються.<br><br><b>Контрольована місцевість (444)</b> — закритий полігон або зона під охороною вартових, перекриті дороги, попереджувальні сигнали, перевірка перед підривом. У зоні перебувають лише поінформовані особи, підпорядковані керівнику робіт. Тому допускається відстань, менша приблизно на 30%, за дещо вищого залишкового ризику для людей, обізнаних про небезпеку.<br><br><b>Практичне правило:</b> відстань 444 застосовуйте лише тоді, коли весь периметр зони справді перебуває під охороною протягом усього часу знищення. Якщо немає впевненості, що жодна стороння особа не зайде, — діє 634.",

(function(){
  function $(id){ return document.getElementById(id); }

  /* ---------- język ---------- */
  var LOCALES = { pl:'pl-PL', en:'en-GB', nl:'nl-NL', uk:'uk-UA' };
  var LANG = 'pl';
  function T(key, vars){
    var s = (I18N[LANG] && I18N[LANG][key] != null) ? I18N[LANG][key] : I18N.pl[key];
    if (s == null) return key;
    if (vars) for (var k in vars) s = s.split('{' + k + '}').join(vars[k]);
    return s;
  }
  function fmt(n, d){ return n.toLocaleString(LOCALES[LANG],{minimumFractionDigits:d,maximumFractionDigits:d}); }
  function num(n){ return n.toLocaleString(LOCALES[LANG]); }
  function parse(s){
    var raw = s.trim().replace(/\s/g,'');
    if (/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(raw) && (LANG === 'en' || raw.indexOf('.') >= 0)) raw = raw.replace(/,/g,'');
    else raw = raw.replace(',', '.');
    return { raw: raw, val: raw === '' ? null : Number(raw) };
  }
  function decimals(s){ var i = s.indexOf('.'); return i < 0 ? 0 : Math.min(s.length - i - 1, 3); }
  function up(x){ return Math.ceil(x - 1e-9); }

  /* ---------- tryby ---------- */
  var MODES = ['fala','odl','imas','tnt'], mode = 'fala';
  var modeBtns = document.querySelectorAll('[data-mode]');
  function setMode(m){
    if (MODES.indexOf(m) < 0) m = 'fala';
    mode = m;
    for (var i=0;i<modeBtns.length;i++) modeBtns[i].setAttribute('aria-pressed', modeBtns[i].dataset.mode === m);
    for (var j=0;j<MODES.length;j++) $('v-' + MODES[j]).hidden = MODES[j] !== m;
    $('title').innerHTML = T('title_' + m); store('mode', m);
  }
  for (var i=0;i<modeBtns.length;i++) modeBtns[i].addEventListener('click', function(){ setMode(this.dataset.mode); });

  /* ---------- FALA ---------- */
  var kEl = $('k'), lEl = $('l');
  function updateFala(){
    var K = parseFloat(kEl.value);
    $('hint').innerHTML = T('f_h' + kEl.value);
    var p = parse(lEl.value);
    $('err').textContent = ''; lEl.classList.remove('bad');
    function empty(msg){ $('res').classList.add('empty'); $('r').textContent = '—'; $('sub').textContent = msg; $('calc').hidden = true; }
    if (p.val === null) { empty(T('f_enter')); return; }
    if (!isFinite(p.val) || p.val <= 0) { lEl.classList.add('bad'); $('err').textContent = T('f_err'); empty(T('invalid')); return; }
    var L = p.val, R = K * Math.sqrt(L), Rr = up(R);

    $('calc').hidden = false;
    $('calc').innerHTML = '<code>' + K + ' · √' + fmt(L, decimals(p.raw)) + ' = ' + K + ' · ' + fmt(Math.sqrt(L),3) + ' = ' + fmt(R,1) + ' m</code>';
  }

  /* ---------- ODŁAMKI ---------- */
  var POCISKI = [
    [37, 76, 500, 600], [76, 105, 700, 800], [105, 150, 850, 1000], [150, 200, 1000, 1200],
    [200, 300, 1200, 1500], [300, 400, 1350, 1800], [400, Infinity, 1500, 2000]
  ];
  var BOMBY = [
    [25, 50, 850, 1000], [100, 100, 1000, 1200], [250, 250, 1200, 1400], [500, 500, 1350, 1500],
    [1000, 1000, 1500, 1700], [1500, 1500, 1600, 1800], [2000, 2000, 1750, 2000],
    [3000, 3000, 1900, 2100], [5000, 5000, 2000, 2200]
  ];
  function labelP(r){ return r[1] === Infinity ? T('over', { n: r[0] }) : r[0] + '–' + r[1]; }
  function labelB(r){ return r[0] === r[1] ? String(r[0]) : r[0] + '–' + r[1]; }
  function findPocisk(c){
    if (c < 37) return { i:0, warn:T('o_w_cal_low') };
    if (c > 400) return { i:6 };
    var i = 0;
    for (var j=0;j<6;j++) if (POCISKI[j][0] <= c) i = j;
    return { i:i, note: (c !== 37 && c === POCISKI[i][0]) ? T('o_boundary') : '' };
  }
  function findBomba(w){
    if (w < 25) return { i:0, warn:T('o_w_bomb_low') };
    if (w > 5000) return { i:BOMBY.length-1, warn:T('o_w_bomb_high') };
    for (var j=0;j<BOMBY.length;j++) if (w <= BOMBY[j][1])
      return { i:j, note: w >= BOMBY[j][0] ? '' : T('o_nearest', { x: labelB(BOMBY[j]) }) };
  }
  var typ = 'pocisk', typBtns = document.querySelectorAll('[data-typ]'), vEl = $('v');
  var vals = { pocisk: load('v_pocisk') || '', bomba: load('v_bomba') || '' };
  function setTyp(t){

  }
  function labelsOdl(){

  }
  for (var i=0;i<typBtns.length;i++) typBtns[i].addEventListener('click', function(){ setTyp(this.dataset.typ); });
  function renderTable(on){
    var rows = typ === 'pocisk' ? POCISKI : BOMBY, lab = typ === 'pocisk' ? labelP : labelB, h = '';

      h += '<tr' + (i === on ? ' class="on"' : '') + '><td>' + lab(rows[i]) + '</td><td>' + num(rows[i][2]) + '</td><td>' + num(rows[i][3]) + '</td></tr>';

    if (p.val === null) { empty(T(P ? 'o_enter_cal' : 'o_enter_wt')); return; }

    var f = P ? findPocisk(p.val) : findBomba(p.val), row = (P ? POCISKI : BOMBY)[f.i];
    $('res2').classList.remove('empty');
    $('o1').textContent = num(row[2]); $('o2').textContent = num(row[3]);
    $('applied').innerHTML = T('o_applied', { x: P ? labelP(row) + ' mm' : labelB(row) + ' kg' }) + (f.note ? '<br>' + f.note : '');
    $('warn').textContent = f.warn || '';
    renderTable(f.i);
  }

  /* ---------- IMAS / NATO ---------- */
  var dtyp = $('dtyp'), auw = $('auw');
  function updateDem(){
    var F = dtyp.value === 'frag';
    $('dhint').innerHTML = T(F ? 'i_h_frag' : 'i_h_bare');
    $('auwLab').textContent = T(F ? 'i_auw' : 'i_mass_bare');
    $('d2Box').hidden = !F; $('dDiv').hidden = !F; $('d1Sub').hidden = !F;
    $('d1Lab').textContent = T(F ? 'i_open' : 'i_bare_lbl');
    var p = parse(auw.value);
    $('err3').textContent = ''; auw.classList.remove('bad');
    function empty(msg){ $('res3').classList.add('empty'); $('d1').textContent='—'; $('d2').textContent='—';
      $('d1c').hidden = true; $('d2c').hidden = true; $('dMsg').textContent = msg; }
    if (p.val === null) { empty(T('i_enter')); return; }
    if (!isFinite(p.val) || p.val <= 0) { auw.classList.add('bad'); $('err3').textContent = T('i_err'); empty(T('invalid')); return; }
    var m = p.val, ms = fmt(m, decimals(p.raw));
    $('res3').classList.remove('empty'); $('dMsg').textContent = '';
    if (F) {
      var r6 = Math.pow(m, 1/6), a = 634*r6, b = 444*r6;
      $('d1').textContent = num(up(a)); $('d2').textContent = num(up(b));
      $('d1c').hidden = false; $('d2c').hidden = false;
      $('d1c').innerHTML = '<code>634 · ' + ms + '<sup>1/6</sup> = 634 · ' + fmt(r6,3) + ' = ' + fmt(a,1) + ' m</code>';
      $('d2c').innerHTML = '<code>444 · ' + ms + '<sup>1/6</sup> = 444 · ' + fmt(r6,3) + ' = ' + fmt(b,1) + ' m</code>';
      $('dMsg').innerHTML = T('i_rule_short', { d: num(up(a)) });
    } else {
      var r3 = Math.cbrt(m), c = 130*r3;
      $('d1').textContent = num(up(c)); $('d1c').hidden = false; $('d2c').hidden = true;

  }
  var vn = '1', vnBtns = document.querySelectorAll('[data-vn]');
  for (var i=0;i<vnBtns.length;i++) vnBtns[i].addEventListener('click', function(){
    if (this.disabled) return; vn = this.dataset.vn; store('vn', vn); updateVert(); });
  function updateVert(){
    var F = dtyp.value === 'frag', multiBtn = vnBtns[1];
    multiBtn.disabled = !F; multiBtn.style.opacity = F ? '' : '.4';

    var m = p.val, ms = fmt(m, decimals(p.raw)), h, c;

    } else { c = Math.pow(m, 1/5); h = 470*c;

    }
    var hr = up(h);
    $('res5').classList.remove('empty'); $('vh').textContent = num(hr); $('vc').hidden = false;
    $('vft').textContent = T('v_ft', { ft: num(up(hr * 3.28084)) });
  }

  /* ---------- RÓWNOWAŻNIK TNT ----------
     IATG 01.80 (wyd. 2), tab. 20: [klucz/nazwa, ciśnienie, impuls]
     Proch czarny: NATO MSIAC L-295 — maks. zmierzony równoważnik 0,43 (impuls). */
  var MW = [
    ['@mat_tnt', 1.00, 1.00], ['Amatol', 0.99, 0.98], ['@mat_compb', 1.11, 0.98],
    ['Composition C3', 1.08, 1.01], ['Composition C4 (C-4)', 1.37, 1.19], ['@mat_hmx', 1.02, 1.03],

  function mwName(r){ return r[0].charAt(0) === '@' ? T(r[0].slice(1)) : r[0]; }
  var mwEl = $('mw'), mmEl = $('mm'), ownEl = $('own');
  function buildMw(){

      h += '<option value="' + i + '">' + mwName(MW[i]) + '</option>';
      tb += '<tr data-i="' + i + '"><td>' + mwName(MW[i]) + (MW[i][3] ? ' *' : '') + '</td><td>' + (MW[i][1] == null ? '—' : fmt(MW[i][1],2)) + '</td><td>' + fmt(MW[i][2],2) + '</td></tr>';

  }
  function updateTnt(){

    for (var i=0;i<rows.length;i++) rows[i].classList.toggle('on', rows[i].dataset.i === mwEl.value);
    $('err6').textContent = ''; mmEl.classList.remove('bad'); ownEl.classList.remove('bad');
    function empty(msg){ $('res6').classList.add('empty'); $('te').textContent = '—'; $('tSub').textContent = msg; $('tc').hidden = true; }
    var k, why;

    var p = parse(mmEl.value);

    $('tc').hidden = false;
    $('tc').innerHTML = '<code>' + fmt(p.val, decimals(p.raw)) + ' kg × ' + fmt(k,2) + ' = ' + fmt(e,3) + ' kg TNT</code>';
  }

  /* ---------- offline ---------- */
  var offState = 'off_check';
  function setOff(on, key){ offState = key; $('dot').classList.toggle('on', on); $('off').textContent = T(key); }

  var langBtns = document.querySelectorAll('[data-lang]');
  function setLang(l){

      if (el.tagName === 'OPTION') el.textContent = s.replace(/<[^>]+>/g,''); else el.innerHTML = s;
    }
    var dec = l === 'en' ? '0.0' : '0,0', kk = l === 'en' ? '1.00' : '1,00';
    var ph = document.querySelectorAll('.ph-dec'); for (var a=0;a<ph.length;a++) ph[a].placeholder = dec;
    var pk = document.querySelectorAll('.ph-k'); for (var b=0;b<pk.length;b++) pk[b].placeholder = kk;
    buildMw();
    setMode(mode); labelsOdl();
    updateFala(); updateOdl(); updateDem(); updateVert(); updateTnt();
    $('off').textContent = T(offState);
  }
  for (var i=0;i<langBtns.length;i++) langBtns[i].addEventListener('click', function(){ setLang(this.dataset.lang); });

  /* ---------- start ---------- */
  var sv;
  sv = load('k'); if (sv === '300' || sv === '150' || sv === '50') kEl.value = sv;
  sv = load('l'); if (sv) lEl.value = sv;
  sv = load('typ'); if (sv === 'pocisk' || sv === 'bomba') typ = sv;
  vEl.value = vals[typ];
  for (var i=0;i<typBtns.length;i++) typBtns[i].setAttribute('aria-pressed', typBtns[i].dataset.typ === typ);
  sv = load('dtyp'); if (sv === 'frag' || sv === 'bare') dtyp.value = sv;
  sv = load('auw'); if (sv) auw.value = sv;
  sv = load('vn'); if (sv === '1' || sv === 'n') vn = sv;
  buildMw();
  sv = load('mw'); if (sv !== null && (sv === 'own' || MW[+sv])) mwEl.value = sv;
  sv = load('mm'); if (sv) mmEl.value = sv;
  sv = load('own'); if (sv) ownEl.value = sv;
  sv = load('mode'); if (MODES.indexOf(sv) >= 0) mode = sv;

  kEl.addEventListener('change', function(){ store('k', kEl.value); updateFala(); });
  lEl.addEventListener('input', function(){ store('l', lEl.value); updateFala(); });
  vEl.addEventListener('input', function(){ vals[typ] = vEl.value; store('v_' + typ, vEl.value); updateOdl(); });
  dtyp.addEventListener('change', function(){ store('dtyp', dtyp.value); updateDem(); updateVert(); });
  auw.addEventListener('input', function(){ store('auw', auw.value); updateDem(); updateVert(); });
  mwEl.addEventListener('change', function(){ store('mw', mwEl.value); updateTnt(); });
  mmEl.addEventListener('input', function(){ store('mm', mmEl.value); updateTnt(); });
  ownEl.addEventListener('input', function(){ store('own', ownEl.value); updateTnt(); });

  var startLang = load('lang');
  if (!startLang || !I18N[startLang]) {
    var nav = ((navigator.languages && navigator.languages[0]) || navigator.language || 'pl').toLowerCase().slice(0,2);
    startLang = nav === 'ua' ? 'uk' : (I18N[nav] ? nav : 'pl');
  }
  setLang(startLang);

  try {
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      navigator.serviceWorker.register('sw.js').then(function(){ return navigator.serviceWorker.ready; })
        .then(function(){ setOff(true, 'off_ok'); })
        .catch(function(){ setOff(false, 'off_na'); });
    } else { setOff(false, 'off_na'); }
  } catch(e) { setOff(false, 'off_na'); }
})();
</script>
</body>
</html>
